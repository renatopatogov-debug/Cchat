name: CI & Android APK (Cloud Build)

on:
  push:
    branches: [main, master, signal-ui]
  pull_request:
  workflow_dispatch:

jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, Lint, i18n & Unit Tests
        run: npx tsc --noEmit && npx eslint . && npm run i18n:check && npx vitest run --passWithNoTests --reporter=dot

      - name: Build Web Bundle
        env:
          APP_NAME: Cchat
        run: npm run build

      - name: Upload Web Dist
        uses: actions/upload-artifact@v6
        with:
          name: armada-web-dist
          path: dist/

  android-apk:
    needs: web-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies & Generate Cchat Icons
        env:
          APP_NAME: Cchat
        run: |
          sudo apt-get update && sudo apt-get install -y inkscape imagemagick
          npm ci
          npm run gen:icons
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug -PapkAbis=arm64-v8a

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: armada-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  i18n-sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies & Prune i18n Catalogs
        run: |
          npm ci
          node scripts/i18n.mjs prune

      - name: Upload Synced i18n Locales
        uses: actions/upload-artifact@v6
        with:
          name: cchat-i18n-locales
          path: src/i18n/locales/*.json
